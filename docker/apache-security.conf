<Directory "/var/www/html">
    <FilesMatch "^(config\\.php|\\.env.*|composer\\.(json|lock)|.*\\.(sqlite|sqlite3|db|bak|log|ini))$">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/html/(includes|data|docker)(/|$)">
    Require all denied
</DirectoryMatch>

<Directory "/var/www/html/uploads">
    Options -Indexes -FollowSymLinks
    <FilesMatch "\\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

<FilesMatch "^\\.">
    Require all denied
</FilesMatch>
