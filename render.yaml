services:
  - type: web
    name: zerif-shop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /
    disk:
      name: zerif-store
      mountPath: /var/lib/zerif-data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
